<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTRA - Digital Office Pupuk Indonesia (Prototype)</title>
  <link rel="stylesheet" href="css/style.css?v=3.1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2300AD78%22/><text y=%2265%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22white%22 x=%2250%22 text-anchor=%22middle%22>S</text></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Persistent Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="#" class="brand-logo" onclick="navigate('surat-masuk'); return false;">
          <svg class="logo-icon-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4C22.5 9 26 12 31.5 12C31.5 17.5 28 21 23 23C25 28 22.5 33.5 17 35C15 30 12 26.5 7 26.5C7 21 10.5 17.5 15.5 15.5C13.5 10.5 15 5.5 20 4Z" stroke="#00AD78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20" cy="19.5" r="4.5" fill="#00AD78"/>
            <path d="M13 19.5C13 15.6 16.1 12.5 20 12.5C23.9 12.5 27 15.6 27 19.5C27 23.4 23.9 26.5 20 26.5" stroke="#00AD78" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <div class="brand-text">
            <h1>SENTRA</h1>
            <span>Streamline Your Work</span>
          </div>
        </a>
        <button class="sidebar-collapse-btn" title="Toggle Sidebar" onclick="toggleSidebar()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>

      <!-- Navigation Links Container (Generated by JS based on role) -->
      <nav class="sidebar-nav" id="sidebar-nav-container"></nav>

      <!-- Sidebar Footer matching screenshot v15.0.1 -->
      <div style="padding: 16px 20px; border-top: 1px solid var(--border-color); font-size: 11px; color: #94A3B3;">
        <div style="font-weight: 600; color: #647789;">v15.0.1</div>
        <div style="margin-top: 2px;">2026 Digitalisasi Corporate Services</div>
      </div>
    </aside>

    <!-- Main Content Shell -->
    <div class="main-wrapper">
      <!-- Top Persistent Header Bar -->
      <header class="top-header" style="justify-content: flex-end; gap: 18px;">
        <!-- Prototype Role Switcher Dropdown for Testing Approval Flow -->
        <div class="role-switcher-container">
          <span class="role-switcher-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Testing as:
          </span>
          <select id="prototype-role-select" class="role-select" onchange="onRoleChange(this.value)">
            <optgroup label="Alur Surat (Step-by-Step)">
              <option value="drafter">Drafter (Muhammad Ridha Fadli)</option>
              <option value="reviewer">Reviewer (Siti Rahma)</option>
              <option value="approver">Approver (Yetty Endarwati)</option>
              <option value="recipient">Penerima Surat (Dewi Lestari)</option>
              <option value="users">Users (Semua Role Terpadu)</option>
            </optgroup>
            <optgroup label="Verifikator & Administrator">
              <option value="admin_stempel">Admin Stempel (Farah Nabila)</option>
              <option value="admin_penerima">Admin Penerima Dokumen (Agus Setiawan)</option>
              <option value="admin_dof">Admin DOF (Rian Pratama)</option>
            </optgroup>
          </select>
        </div>

        <!-- Notification, Settings & User Profile Header Icons (Exact Reference Match) -->
        <div class="header-actions" style="gap: 12px;">
          <button class="table-icon-btn" title="Notifikasi" onclick="showToast('Pemberitahuan: 2 dokumen baru memerlukan telaah.')">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#647789" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          </button>
          <button class="table-icon-btn" title="Pengaturan Prototype & Demo" onclick="openSettingsModal()">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#647789" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <div style="width: 34px; height: 34px; border-radius: 50%; background: #E5EAEE; display: flex; align-items: center; justify-content: center; cursor: pointer;" title="Profil Pengguna">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#94A3B3"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
        </div>
      </header>


      <!-- Main Dynamic Content Canvas -->
      <main class="page-content" id="main-content-view">
        <!-- Rendered by JS -->
      </main>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Filter Drawer Container (Slide-over matching screenshot) -->
  <div id="filter-drawer-container"></div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/initialData.js?v=1.5"></script>
  <script src="js/app.js?v=4.7"></script>
</body>
</html>
